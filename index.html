<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nicanda Studios – Updates</title>
<style>
:root { color-scheme: light dark; --grund: #f7f4ee; --text: #24211c; --leise: #6b6459;
  --linie: #ddd6ca; --akzent: #8a5a2b; }
@media (prefers-color-scheme: dark) {
  :root { --grund: #1c1a17; --text: #ece7de; --leise: #a59d90; --linie: #3a362f; --akzent: #d6a46c; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--grund); color: var(--text);
  font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
main, footer { max-width: 42rem; margin: 0 auto; padding: 0 1rem; }
main { padding-top: 2.5rem; padding-bottom: 2rem; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 .75rem; }
h2 { font-size: 1.15rem; margin: 0 0 .25rem; }
h3 { font-size: 1rem; margin: .9rem 0 .2rem; }
p { margin: 0 0 1rem; }
a { color: var(--akzent); }
.leise { color: var(--leise); font-weight: normal; }
ol.versionen { list-style: none; margin: 1.5rem 0 0; padding: 0; }
ol.versionen > li { border-top: 1px solid var(--linie); padding: 1rem 0; }
ul { margin: .2rem 0 .4rem; padding-left: 1.2rem; }
ul li { margin: .35rem 0; }
ul.apps { list-style: none; padding: 0; margin: 1.5rem 0 0; }
ul.apps li { border-top: 1px solid var(--linie); padding: .9rem 0; margin: 0; font-size: 1.15rem; }
footer { border-top: 1px solid var(--linie); padding-top: 1rem; padding-bottom: 2rem; font-size: .9rem; }
</style>
</head>
<body>
<main>
<h1>Updates</h1>
<p>Was sich in den Apps von Nicanda Studios geändert hat.</p>
<ul class="apps">
<li><a href="daymory/">Daymory</a></li>
</ul>
</main>
<footer>
<p>Nicanda Studios · <a href="https://legal.nicandastudios.ch/">Rechtliches</a></p>
</footer>
</body>
</html>
